[package]
authors = ["Jeff Muizelaar <jmuizelaar@mozilla.com>"]
description = "A library to extract content from pdfs"
documentation = "https://docs.rs/crate/pdf-extract/"
edition = "2018"
keywords = ["pdf2text", "text", "pdf", "pdf2txt"]
license = "MIT"
name = "pdf-extract"
repository = "https://github.com/jrmuizel/pdf-extract"
version = "0.12.0"
include = ["src/**/*", "README.md"]

[profile.release]
debug = true

[dependencies]
# These revisions include malformed-input and resource-limit hardening required by
# the Syzygy desktop consumer. Keep them pinned with this hardened branch.
adobe-cmap-parser = { git = "https://gitlab.com/cxxl/adobe-cmap-parser.git", rev = "70b000d88f4f3b86010c248dd5f8f236f1555e61", version = "0.4.2" }
encoding_rs = "0.8.34"
euclid = "0.20.5"
lopdf = {version = "0.42", default-features = false, features = ["wasm_js"]}
postscript = "0.14"
type1-encoding-parser = { git = "https://gitlab.com/cxxl/type1-encoding-parser.git", rev = "401328a52586a6a220205e290e04fd1bfc7ae5ba", version = "0.1.1" }
unicode-normalization = "0.1.19"
cff-parser = { git = "https://gitlab.com/cxxl/cff-parser.git", rev = "fb7a4b57fa8fc6800623776cdfe28c4d9cee8374", version = "0.2.1" }
log = "0.4.22"

[dev-dependencies]
ureq = "2.6.2"
test-log = "0.2.17"

[dev-dependencies.simple_logger]
version = "5"
default-features = false
features = ["colors"]
